<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #22223a;
    --surface-alt: #2a2a45;
    --border: #3a3a5c;
    --text: #e0e0e8;
    --text-muted: #9999b0;
    --accent: #7c6ff7;
    --accent-light: #9d93f9;
    --highlight: #f7c46c;
    --green: #6fcf97;
    --red: #f27676;
    --blue: #6cb4ee;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    padding: 1rem;
  }

  h1 {
    font-size: 2rem;
    color: var(--accent-light);
    margin-bottom: 0.25rem;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 0.75rem;
  }

  h2 {
    font-size: 1.4rem;
    color: var(--highlight);
    margin-top: 2.5rem;
    margin-bottom: 1rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--border);
  }

  h3 {
    font-size: 1.1rem;
    color: var(--blue);
    margin-top: 1.5rem;
    margin-bottom: 0.5rem;
  }

  p { margin-bottom: 1rem; }

  strong { color: #fff; }
  em { color: var(--text-muted); font-style: italic; }

  a { color: var(--accent-light); text-decoration: none; }
  a:hover { text-decoration: underline; }

  code {
    background: var(--surface-alt);
    padding: 0.15em 0.4em;
    border-radius: 4px;
    font-size: 0.9em;
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: var(--accent-light);
  }

  blockquote {
    border-left: 3px solid var(--accent);
    background: var(--surface);
    padding: 1rem 1.25rem;
    margin: 1rem 0;
    border-radius: 0 8px 8px 0;
    color: var(--text);
  }

  blockquote p { margin-bottom: 0; }

  ul, ol {
    padding-left: 1.5rem;
    margin-bottom: 1rem;
  }

  li { margin-bottom: 0.4rem; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0;
    background: var(--surface);
    border-radius: 8px;
    overflow: hidden;
  }

  thead { background: var(--surface-alt); }

  th {
    text-align: left;
    padding: 0.75rem 1rem;
    color: var(--accent-light);
    font-weight: 600;
    border-bottom: 2px solid var(--border);
  }

  td {
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--border);
  }

  tr:last-child td { border-bottom: none; }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2rem 0;
  }

  .meta {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 2rem;
    font-size: 0.9rem;
    color: var(--text-muted);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.3rem 2rem;
  }

  .meta span { color: var(--text); }

  @media print {
    body { background: #fff; color: #222; padding: 0.5rem; }
    h1 { color: #333; border-color: #333; }
    h2 { color: #555; border-color: #ccc; }
    h3 { color: #444; }
    strong { color: #000; }
    em { color: #666; }
    code { background: #f0f0f0; color: #333; }
    blockquote { background: #f8f8f8; border-color: #999; color: #333; }
    table { background: #fff; }
    thead { background: #f0f0f0; }
    th { color: #333; border-color: #ccc; }
    td { border-color: #ddd; }
    .meta { background: #f8f8f8; border-color: #ddd; color: #666; }
    .meta span { color: #333; }
    a { color: #333; }
    hr { border-color: #ddd; }
  }
</style>
</head>
<body>

<div class="meta">
  <div>Type: <span>{{type}}</span></div>
  <div>Company: <span>{{company}}</span></div>
  <div>Scheduled: <span>{{scheduled}}</span></div>
  <div>Contact: <span>{{contact}}</span></div>
  <div>Role: <span>{{role}}</span></div>
  <div>Source: <span>{{source}}</span></div>
</div>

{{content}}

</body>
</html>
